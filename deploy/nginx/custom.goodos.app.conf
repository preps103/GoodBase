server {
    listen 80;
    listen [::]:80;
    server_name custom.goodos.app customs.goodos.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://custom.goodos.app$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name custom.goodos.app;

    ssl_certificate /etc/letsencrypt/live/custom.goodos.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/custom.goodos.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name customs.goodos.app;

    ssl_certificate /etc/letsencrypt/live/customs.goodos.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/customs.goodos.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 308 https://custom.goodos.app$request_uri;
}
